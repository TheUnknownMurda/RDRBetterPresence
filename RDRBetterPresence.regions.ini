; Optional location overrides for RDRBetterPresence, matched by player coordinates.
;
; The plugin first asks the game for the current district (CORE::GET_DISTRICTS_NAME).
; Rectangles listed here take priority over it, which lets you name towns, ranches
; and landmarks precisely. Smaller rectangles win over bigger ones.
;
; Format (one per line):   Display Name=xmin,ymin,xmax,ymax
;
; To find coordinates, set ShowCoordinates=true in RDRBetterPresence.ini (they appear
; on the presence and in the log), or read "District changed ... at (x, y, z)" lines
; in RDRBetterPresence.log.
;
; The large image for a location is region_<slug>, where slug is the name in lowercase
; ASCII with '_' between words (Armadillo -> region_armadillo, MacFarlane's Ranch ->
; region_macfarlane_s_ranch).

[Regions]
; Armadillo=2600,-1700,2800,-1500
; MacFarlane's Ranch=1800,-1200,2000,-1000
