; Optional location overrides for RDRBetterPresence, matched by player coordinates.
;
; The plugin already knows ~30 towns and landmarks (Armadillo, MacFarlane's Ranch, Blackwater,
; Chuparosa, Escalera, ...) and derives the region (Cholla Springs, Rio Bravo, Perdido, ...)
; from the nearest one. Rectangles listed here take priority over that table, which lets you
; name extra places (a ranch, a hideout, a camp) precisely. Smaller rectangles win over bigger ones.
;
; The game world is Y-up: X grows to the east, Z to the south, Y is the altitude.
; Format (one per line):   Display Name=xmin,zmin,xmax,zmax
;
; To find coordinates, set ShowCoordinates=true in RDRBetterPresence.ini (they appear on the
; presence as "(x, z)") or read the "Location changed ... at x=... z=..." lines in RDRBetterPresence.log.

[Regions]
; Example - a 300 x 300 box around Beecher's Hope:
; Beecher's Hope=-233,1224,67,1524
