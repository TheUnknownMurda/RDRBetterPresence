; RDRBetterPresence - Discord Rich Presence for Red Dead Redemption (PC)
; This file is read once when the plugin loads (game start, or `reload "RDRBetterPresence"` in the F8 RedHook console).

[Discord]
; Application ID from https://discord.com/developers/applications
ClientId=1551545265159274516
; Minimum delay between two presence updates, in milliseconds (Discord rate-limits at ~5 per 20 s).
UpdateIntervalMs=15000
; Delay before retrying when Discord is not running / the pipe is closed.
ReconnectDelayMs=10000

[Presence]
; Language of the presence text: en or fr
Language=en
ShowTimeOfDay=true
ShowWeather=true
ShowHealth=true
ShowWeapon=true
ShowOutfit=true
; Cash, honor and fame in the hover text of the large image.
ShowMoney=true
; "Wanted $x" on the activity line while a bounty is active.
ShowBounty=true
; Story / stranger missions, minigames and jobs by name.
ShowMissions=true
; Append the player's X/Z to the state line (useful to calibrate RDRBetterPresence.regions.ini).
ShowCoordinates=false
; Asset key (uploaded in the Discord app > Rich Presence > Art Assets) or an https:// image URL.
LargeImageDefault=rdr_logo
; When true, the large image becomes region_<slug> (e.g. region_cholla_springs) if the region is known.
UseRegionImages=true

[Buttons]
; Up to two buttons shown under the presence (leave empty to hide).
Button1Label=
Button1Url=
Button2Label=
Button2Url=

[Debug]
LogToFile=true
LogToConsole=true
; debug | info | warning | error   (debug logs every sampled game state)
LogLevel=info
; How often the game state is sampled, in milliseconds.
PollIntervalMs=500
